# The Rust port (ADR 0028, Phase 24): one workspace for the server, sim core, client and tools.
# Crates are added as their sub-phase starts. `server/net/wt` stays outside the workspace (the C++
# build links it through Corrosion) until it moves to `crates/dwell-net` in 24d.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["server/net/wt"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Physics and worldgen are unusably slow unoptimised; dependencies are built optimised once.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
