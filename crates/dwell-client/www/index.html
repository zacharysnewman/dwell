<!doctype html>
<!-- The WebGPU probe page (Phase 24a): client/e2e-webgpu loads it in headless Chromium. -->
<meta charset="utf-8" />
<title>Dwell WebGPU probe</title>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
  import init, { probeOffscreen, probeCanvas } from './pkg/dwell_client.js';
  const result = {};
  try {
    await init();
    result.pixels = Array.from(await probeOffscreen());
    result.adapter = await probeCanvas(document.getElementById('c'));
  } catch (e) {
    result.error = String(e?.message ?? e);
  }
  window.__probe = result;
</script>
