[package]
name = "dwell-client"
description = "Dwell's browser client: the wgpu renderer (WebGPU only) and, from 24e, the sim (ADR 0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true
