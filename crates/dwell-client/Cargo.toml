[package]
name = "dwell-client"
description = "Dwell's browser client: the wgpu renderer (WebGPU only) and, from 24e, the sim (ADR 0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
futures-channel = "0.3"
bytemuck = "1"
dwell-blocks = { path = "../dwell-blocks" }
dwell-game = { path = "../dwell-game" }
dwell-lod = { path = "../dwell-lod" }
dwell-look = { path = "../dwell-look" }
dwell-mesh = { path = "../dwell-mesh" }
dwell-physics = { path = "../dwell-physics" }
dwell-protocol = { path = "../dwell-protocol" }
dwell-sim = { path = "../dwell-sim" }
dwell-storage = { path = "../dwell-storage" }
dwell-world = { path = "../dwell-world" }
dwell-worldgen = { path = "../dwell-worldgen" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "HtmlCanvasElement", "Window", "MessageEvent", "ReadableStream", "ReadableStreamDefaultReader",
    "WritableStream", "WritableStreamDefaultWriter", "WebTransport", "WebTransportOptions", "WebTransportHash",
    "WebTransportCongestionControl", "WebTransportBidirectionalStream", "WebTransportReceiveStream",
    "WebTransportSendStream", "WebTransportDatagramDuplexStream", "WebTransportCloseInfo", "RtcPeerConnection",
    "RtcPeerConnectionState", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType",
    "RtcSdpType", "RtcSessionDescriptionInit", "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions",
    "Worker", "Performance", "console",
] }

[dev-dependencies]
ed25519-dalek = "2"
# A stub device (wgpu's noop backend) for the renderer's native tests; never in a build.
wgpu = { version = "30.0.1", default-features = false, features = ["noop", "webgpu", "wgsl"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
# The test registry (`test:oil`): a second fluid's parameters in the water shader's buffer.
dwell-blocks = { path = "../dwell-blocks", features = ["fixture"] }

[lints]
workspace = true
