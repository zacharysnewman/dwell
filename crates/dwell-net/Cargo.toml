[package]
name = "dwell-net"
description = "Dwell's network front-end: WebTransport (wtransport) and WebRTC data channels (str0m), and master-server registration (ADRs 0001, 0008, 0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "self-signed"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
str0m = { version = "0.23.1", default-features = false, features = ["aws-lc-rs"] }
getrandom = "0.3"
ring = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
