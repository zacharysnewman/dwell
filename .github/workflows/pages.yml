name: Deploy site to GitHub Pages

# Published at https://dropkickarcade.com/dwell/ (ADR 0005). The site is assembled from the GitHub
# Releases (RELEASES.md §4):
#   /dwell/index.html          the launcher (client/launcher)
#   /dwell/versions.json       the manifest of the builds below
#   /dwell/v/<version>/…       every stable release and the newest dev builds, each unpacked
# Called by release.yml after a release is published; run by hand to rebuild the site (e.g. after a
# launcher change, or to re-deploy).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write # prune old dev releases
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Dev builds kept on the site and as releases (client/scripts/site.ts).
  DEV_KEEP: 10

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The launcher is built from the default branch, whichever release called this.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Choose the builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: client
        run: |
          gh release list --limit 500 --json tagName > "$RUNNER_TEMP/releases.json"
          node --experimental-strip-types scripts/site.ts plan "$RUNNER_TEMP/releases.json" "$DEV_KEEP" | tee "$RUNNER_TEMP/plan.json"
      - name: Download the builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(jq -r '.keep[]' "$RUNNER_TEMP/plan.json"); do
            dir="site/v/${tag#v}"
            mkdir -p "$dir" "$RUNNER_TEMP/dl/$tag"
            gh release download "$tag" --pattern 'dwell-*.tar.gz' --dir "$RUNNER_TEMP/dl/$tag"
            tar -xzf "$RUNNER_TEMP/dl/$tag"/dwell-*.tar.gz -C "$dir"
          done
      - name: Build the launcher and the manifest
        working-directory: client
        run: |
          npm run build:launcher
          cp -r dist-launcher/. ../site/
          node --experimental-strip-types scripts/site.ts manifest ../site
      - name: Report the site's size against the 1 GB Pages limit
        working-directory: client
        run: node --experimental-strip-types scripts/site.ts size ../site | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Prune old dev builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(jq -r '.prune[]' "$RUNNER_TEMP/plan.json"); do
            gh release delete "$tag" --cleanup-tag --yes
          done

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
