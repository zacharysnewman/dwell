name: Release

# Every build is a git tag with a GitHub Release holding the built files (RELEASES.md §3):
#   - a push to main        → a dev build, `v<next version>-dev.<run>` (a GitHub pre-release) —
#                             or, if the push raised client/package.json above the newest
#                             release (the baseline, a new line), that version as a stable release;
#   - a pushed `v<version>` tag, or this workflow run by hand
#                           → a stable release.
# The version follows the newest release (its next patch), so nothing is bumped after a release;
# client/package.json is a floor, raised by hand only for a breaking change (the merge that raises
# it is the release), and the manual run can name a higher version (client/scripts/release.ts, RELEASES.md §3).
# Each build is made for its own path (`/dwell/v/<version>/`); the site is then assembled from the
# releases by pages.yml, called at the end (a workflow's own GITHUB_TOKEN can't trigger another).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (empty: the next patch after the newest release; e.g. 0.2.0 for a breaking change)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# One group per pushed commit (or tag): every push gets its own run and none is ever cancelled.
# A shared group per ref kept only one run waiting, so back-to-back merges dropped the earlier
# one's release (0.11.14 had to be tagged by hand). Each run publishes only its own version; the
# site deploys (pages.yml) still go one at a time and the last assembles every release.
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      buildVersion: ${{ steps.plan.outputs.buildVersion }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      archive: ${{ steps.plan.outputs.archive }}
      publish: ${{ steps.check.outputs.action }}
      event: ${{ steps.plan.outputs.event }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent commit too: a push releases package.json's version only if it raised it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.version }}
        run: |
          gh release list --limit 500 --json tagName > "$RUNNER_TEMP/releases.json"
          case "$GITHUB_REF" in
            refs/tags/*) event=tag ;;
            refs/heads/*) if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then event=dispatch; else event=push; fi ;;
            *) echo "::error::unexpected ref $GITHUB_REF"; exit 1 ;;
          esac
          previous=$(git show HEAD^1:client/package.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
          node --experimental-strip-types scripts/release.ts "$event" "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$RUNNER_TEMP/releases.json" "$REQUESTED" "$previous" | tee -a "$GITHUB_OUTPUT"
          echo "event=$event" >> "$GITHUB_OUTPUT"
      # A release is made once (release.ts publishAction): checked here, and again just before
      # publishing, since another run may publish the version in between.
      - id: check
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          EVENT: ${{ steps.plan.outputs.event }}
        run: |
          tag_commit=$(git ls-remote --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | sort -k2 | tail -1 | cut -f1)
          exists=false; gh release view "$TAG" >/dev/null 2>&1 && exists=true
          node --experimental-strip-types scripts/release.ts publish "$CHANNEL" "$EVENT" "$GITHUB_SHA" "${tag_commit:--}" "$exists" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.publish == 'create'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    env:
      # The build embeds this version (client/vite.config.ts and crates/dwell-sim/build.rs read it)
      # and is made for its own path, /dwell/v/<version>/.
      DWELL_VERSION: ${{ needs.plan.outputs.buildVersion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain and the wasm32 target (keep in sync with rust-toolchain.toml)
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - name: Build the Rust client (WASM; carries DWELL_VERSION, crates/dwell-sim/build.rs)
        run: npm run build:wasm
      - run: npm run build
        env:
          # The master server's URL (repository variable, Phase 5 manual setup); empty until set.
          VITE_MASTER_URL: ${{ vars.VITE_MASTER_URL }}
      - name: Check the build is the version and path it should be
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node -e '
            const b = JSON.parse(require("fs").readFileSync("dist/build.json", "utf8"));
            if (b.version !== process.env.VERSION) throw new Error("build.json says " + b.version);
            const html = require("fs").readFileSync("dist/index.html", "utf8");
            if (!html.includes("/dwell/v/" + process.env.VERSION + "/")) throw new Error("index.html is not based at /dwell/v/<version>/");
            if (!require("fs").existsSync("dist/THIRD_PARTY_NOTICES.txt")) throw new Error("no THIRD_PARTY_NOTICES.txt");
          '
      - name: Archive the build
        env:
          ARCHIVE: ${{ needs.plan.outputs.archive }}
        run: tar -czf "../$ARCHIVE" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            ${{ needs.plan.outputs.archive }}
            client/dist/build.json
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          ARCHIVE: ${{ needs.plan.outputs.archive }}
          EVENT: ${{ needs.plan.outputs.event }}
        run: |
          # Again, just before publishing (release.ts publishAction): another run may have published
          # this version since the plan.
          tag_commit=$(git ls-remote --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | sort -k2 | tail -1 | cut -f1)
          exists=false; gh release view "$TAG" >/dev/null 2>&1 && exists=true
          action=$(cd client && node --experimental-strip-types scripts/release.ts publish "$CHANNEL" "$EVENT" "$GITHUB_SHA" "${tag_commit:--}" "$exists" | sed -n 's/^action=//p')
          if [ "$action" != create ]; then
            echo "$TAG is already published (or this push is not its release): nothing to do."
            exit 0
          fi
          # `build.json` was uploaded from client/dist/, so it sits under client/dist/ here.
          files=("$ARCHIVE" client/dist/build.json)
          if [ "$CHANNEL" = dev ]; then
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --prerelease \
              --title "Dwell $VERSION (dev)" --notes "Dev build of $GITHUB_SHA."
          elif git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Dwell $VERSION" --generate-notes
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Dwell $VERSION" --generate-notes
          fi

  site:
    name: Update the site
    needs: [plan, publish]
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
