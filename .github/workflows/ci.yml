name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and block registry (generated files up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate constants and golden vectors
        run: |
          node shared/protocol/gen.mjs
          node shared/blocks/gen.mjs
          node shared/structures/gen.mjs
          node shared/look/gen.mjs
          node shared/brushes/gen.mjs
          node --test shared/look/gen.test.mjs
          node shared/look/clouds.mjs
          node --test shared/look/clouds.test.mjs
          node shared/look/reflections.mjs
          node --test shared/look/reflections.test.mjs
          node shared/look/shadows.mjs
          node --test shared/look/shadows.test.mjs
          node shared/look/lodshadows.mjs
          node --test shared/look/lodshadows.test.mjs
          node shared/look/spyglass.mjs
          node --test shared/look/spyglass.test.mjs
          node shared/look/fog.mjs
          node --test shared/look/fog.test.mjs
          node shared/look/lodblend.mjs
          node --test shared/look/lodblend.test.mjs
          node shared/look/lodcolour.mjs
          node --test shared/look/lodcolour.test.mjs
          node shared/look/outline.mjs
          node --test shared/look/outline.test.mjs
          node shared/look/pixelart.mjs
          node --test shared/look/pixelart.test.mjs
          node shared/look/ambient.mjs
          node --test shared/look/ambient.test.mjs
          node shared/look/light.mjs
          node --test shared/look/light.test.mjs
          node shared/look/lights.mjs
          node --test shared/look/lights.test.mjs
          node shared/look/flames.mjs
          node --test shared/look/flames.test.mjs
          node shared/look/daynight.mjs
          node --test shared/look/daynight.test.mjs
          node shared/textures/gen.mjs
          node --test shared/textures/gen.test.mjs
          node shared/characters/gen.mjs
          node --test shared/characters/gen.test.mjs
          node shared/sounds/gen.mjs
          node shared/worldgen/gen.mjs
          node --test shared/worldgen/gen.test.mjs
          python3 shared/protocol/make_vectors.py
          node shared/master/make_vectors.mjs
          git diff --exit-code
      - name: Block data's face-tile rules (PAINTERLY_TEXTURES.md §2)
        run: node --test shared/blocks/faces.test.mjs
      - name: Block data's light sources (LIGHTS.md §2)
        run: node --test shared/blocks/lights.test.mjs
      - name: Block data's multi-cell blocks (BLOCK_REGISTRY.md)
        run: node --test shared/blocks/parts.test.mjs
      - name: Structure generator tests
        run: node --test shared/structures/gen.test.mjs

  master:
    name: Master server (lint, typecheck, test in the Workers runtime)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/master/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundle as a deploy would (no upload)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'

  client-lint:
    name: Client (format, lint, typecheck)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain and the wasm32 target (keep in sync with rust-toolchain.toml)
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      # The Rust client's module and its types (src/pkg), which the shell imports.
      - run: npm run build:wasm
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  client:
    name: Client (test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain and the wasm32 target (keep in sync with rust-toolchain.toml)
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - name: Build the Rust client (WASM, wasm-bindgen)
        run: npm run build:wasm
      - run: npm test
      # `npm run build` type-checks too; format and lint run in the client-lint job.
      - run: npm run build
      - name: Build the launcher (RELEASES.md §5)
        run: npm run build:launcher

  e2e:
    # The browser suite is serial (one worker, fixed ports), so it is split across runners; each
    # builds what it needs. Shard 1 also runs the checks that are not sharded.
    name: End-to-end ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            platforms/electron/package-lock.json
            services/master/package-lock.json
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Rust toolchain and the wasm32 target (keep in sync with rust-toolchain.toml)
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build the dedicated server (dwell-server)
        run: cargo build --release -p dwell-server
      - name: Build client (the Rust client's WASM)
        working-directory: client
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Install the master server (a local `wrangler dev` for friend-world tests)
        working-directory: services/master
        run: npm ci
      # Headed under Xvfb: headless Chromium's software WebGPU loses its device when a canvas
      # presents (playwright.config.ts).
      - name: Browser end-to-end tests (shard ${{ matrix.shard }}/4)
        working-directory: client
        run: xvfb-run -a -s "-screen 0 1280x800x24" npx playwright test --shard=${{ matrix.shard }}/4
      - name: Launcher end-to-end tests (a locally assembled site with three versions)
        if: matrix.shard == 1
        working-directory: client
        run: npm run e2e:site
      - name: Electron smoke test (WebTransport and local mode)
        if: matrix.shard == 1
        working-directory: platforms/electron
        run: |
          npm ci
          ../../target/release/dwell-server --port 4433 --visibility none > server.log &
          sleep 2
          QUERY="?$(grep -o 'invite link: .*' server.log | cut -d'?' -f2)"
          xvfb-run -a npx electron . --smoke --no-sandbox "--join=$QUERY"
          xvfb-run -a npx electron . --smoke --no-sandbox "--join=?local=1"

  rust:
    # The Rust workspace (ADR 0028): the third-party notices, format, clippy (native and the
    # client's wasm32 target), tests in three frames and under WASM, the performance gate, and the
    # WebGPU probe in headless Chromium.
    name: Rust workspace (notices, fmt, clippy, tests, WebGPU probe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain (keep in sync with rust-toolchain.toml)
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown wasm32-wasip1 --toolchain 1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,wasm-bindgen@0.2.129
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p dwell-client --target wasm32-unknown-unknown -- -D warnings
      # After a build: it reads each crate's licence from its downloaded source.
      - name: Third-party notices are up to date (RELEASES.md §2)
        run: python3 shared/licenses/gen.py --check
      - name: Tests
        run: cargo nextest run --workspace
      - name: Player controller ~8,000 km from the origin and on face B (ADR 0011, ADR 0023)
        run: |
          DWELL_ORIGIN_X=far cargo nextest run -p dwell-physics
          DWELL_FACE=b cargo nextest run -p dwell-physics
          DWELL_ORIGIN_X=far cargo nextest run -p dwell-sim --test netcode
      - name: Deterministic suites under WASM (worldgen goldens, the controller's golden trace as the native↔WASM divergence check, ADR 0010; the fly-out-of-the-build-sphere LOD scenario, Phase 16; Node's WASI, tools/wasi-run.mjs)
        run: cargo test -p dwell-blocks -p dwell-protocol -p dwell-world -p dwell-worldgen -p dwell-physics -p dwell-lod --target wasm32-wasip1
      - name: 64 players' controller passes under 1 ms per tick (Release, enhanced-determinism on)
        run: cargo test --release -p dwell-physics --test scenario sixty_four -- --nocapture
      - name: WebGPU probe in headless Chromium
        working-directory: client
        run: |
          npm ci
          npm run build:probe
          npx playwright install --with-deps chromium
          npm run e2e:webgpu

  # The one check to require in branch protection: the jobs above come and go (and the e2e matrix
  # has one name per shard) but this stays, and a skipped or failed job fails it.
  ci:
    name: CI
    if: always()
    needs: [protocol, master, client-lint, client, e2e, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")' >/dev/null
