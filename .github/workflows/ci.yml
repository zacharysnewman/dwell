name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and block registry (generated files up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate constants and golden vectors
        run: |
          node shared/protocol/gen.mjs
          node shared/blocks/gen.mjs
          python3 shared/protocol/make_vectors.py
          node shared/master/make_vectors.mjs
          git diff --exit-code

  master:
    name: Master server (lint, typecheck, test in the Workers runtime)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/master/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundle as a deploy would (no upload)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'

  client-lint:
    name: Client (format, lint, typecheck)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  client:
    name: Client (WASM suites, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.10-${{ runner.os }}
      - name: Install Emscripten (keep in sync with ARCHITECTURE.md §3.1)
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.10
          ~/emsdk/emsdk activate 6.0.10
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: npm ci
      - name: Build local-mode WASM core
        run: npm run build:wasm
      - name: Player controller suite under WASM (Node)
        run: node ../server/build/wasm/tools/dwell_player_tests.js
      - name: Player controller suite under WASM, ~8,000 km from the origin (ADR 0011)
        run: node ../server/build/wasm/tools/dwell_player_tests.js --dwell-origin-x=far
      - name: Player controller suite under WASM on face B, the mirror image (ADR 0023)
        run: node ../server/build/wasm/tools/dwell_player_tests.js --dwell-face=b -tse="netcode*"
      - name: Worldgen suite under WASM (Node) — golden chunk hashes match native (ADR 0010)
        run: node ../server/build/wasm/tools/dwell_worldgen_tests.js
      - name: Storage suite under WASM (Node) — the browser's VFS; opens the natively written world file (§6.4)
        run: node ../server/build/wasm/tools/dwell_storage_tests.js
      - run: npm test
        env:
          DWELL_REQUIRE_WASM: '1'
      # `npm run build` type-checks too; format and lint run in the client-lint job.
      - run: npm run build
      - name: Build the launcher (RELEASES.md §5)
        run: npm run build:launcher

  server-lint:
    name: Server (formats, clippy, Rust tests, generated header)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Rust toolchain (keep in sync with rust-toolchain.toml)
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/net/wt
      - name: Third-party notices are up to date (RELEASES.md §2)
        run: python3 shared/licenses/gen.py --check
      - name: C++ format
        run: find server/core server/app server/tests \( -name '*.cpp' -o -name '*.h' \) ! -name '*.gen.h' | xargs clang-format --dry-run --Werror
      - name: Rust format, clippy, tests
        working-directory: server/net/wt
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: C header is up to date (cbindgen)
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          server/net/wt/gen-header.sh
          git diff --exit-code -- server/net/wt/include

  server:
    name: Server (C++ build and tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Rust toolchain (keep in sync with rust-toolchain.toml)
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/net/wt
      - name: Configure
        working-directory: server
        run: cmake --preset dev
      - name: Build
        working-directory: server
        run: cmake --build --preset dev
      - name: Test
        working-directory: server
        run: ctest --preset dev
      - name: Player and netcode suites ~8,000 km from the origin (ADR 0011)
        working-directory: server
        run: build/dev/tests/dwell_tests --dwell-origin-x=far -ts="player*,netcode*"
      - name: Player suites on face B, the mirror image of face A (ADR 0023)
        working-directory: server
        run: |
          build/dev/tests/dwell_tests --dwell-face=b -ts="player*"
          build/dev/tests/dwell_tests --dwell-face=b --dwell-origin-x=far -ts="player*"
      - name: Smoke-run server
        # The server runs until signalled: start it, then after 10 s ask it to stop (SIGINT) and
        # require a clean shutdown (--preserve-status: its own exit code, not timeout's 124).
        run: timeout --preserve-status --signal=INT 10s server/build/dev/app/dwell_server --world '' --visibility none

  server-perf:
    name: Server (player controller performance gate, Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Rust toolchain (keep in sync with rust-toolchain.toml)
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/net/wt
      - name: Player controller performance gate and golden trace (Release)
        working-directory: server
        run: |
          cmake --preset release
          cmake --build --preset release --target dwell_tests
          build/release/tests/dwell_tests -ts="player: performance,player: scenario"
          build/release/tests/dwell_tests --dwell-origin-x=far -ts="player: performance,player: scenario"

  e2e:
    # The browser suite is serial (one worker, fixed ports), so it is split across runners; each
    # builds what it needs. Shard 1 also runs the checks that are not sharded.
    name: End-to-end ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            platforms/electron/package-lock.json
            services/master/package-lock.json
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb
      - name: Rust toolchain (keep in sync with rust-toolchain.toml)
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/net/wt
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.10-${{ runner.os }}
      - name: Install Emscripten (keep in sync with ARCHITECTURE.md §3.1)
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.10
          ~/emsdk/emsdk activate 6.0.10
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build native server
        working-directory: server
        run: cmake --preset dev -DDWELL_BUILD_TESTS=OFF && cmake --build --preset dev --target dwell_server
      - name: Build client (with local-mode WASM)
        working-directory: client
        run: |
          npm ci
          npm run build:wasm
          npm run build
      - name: Native↔WASM controller divergence (PLAYER_CONTROLLER.md §8.3)
        if: matrix.shard == 1
        run: |
          cmake --build server/build/dev --target dwell_scenario_trace
          node server/tools/divergence.mjs server/build/dev/tools/dwell_scenario_trace server/build/wasm/tools/dwell_scenario_trace.js
      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Install the master server (a local `wrangler dev` for friend-world tests)
        working-directory: services/master
        run: npm ci
      - name: Browser end-to-end tests (shard ${{ matrix.shard }}/4)
        working-directory: client
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Launcher end-to-end tests (a locally assembled site with three versions)
        if: matrix.shard == 1
        working-directory: client
        run: npm run e2e:site
      - name: Electron smoke test (WebTransport and local mode)
        if: matrix.shard == 1
        working-directory: platforms/electron
        run: |
          npm ci
          ../../server/build/dev/app/dwell_server --port 4433 --visibility none > server.log &
          sleep 2
          QUERY="?$(grep -o 'invite link: .*' server.log | cut -d'?' -f2)"
          xvfb-run -a npx electron . --smoke --no-sandbox "--join=$QUERY"
          xvfb-run -a npx electron . --smoke --no-sandbox "--join=?local=1"

  # The one check to require in branch protection: the jobs above come and go (and the e2e matrix
  # has one name per shard) but this stays, and a skipped or failed job fails it.
  ci:
    name: CI
    if: always()
    needs: [protocol, master, client-lint, client, server-lint, server, server-perf, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")' >/dev/null
