name: Deploy master server

# The master server (services/master, ARCHITECTURE.md §10.3, ADR 0013) on Cloudflare Workers.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (manual setup in
# docs/IMPLEMENTATION_PLAN.md, Phase 5); without them the deploy is skipped with a notice.
on:
  push:
    branches: [main]
    paths:
      - services/master/**
      - .github/workflows/master.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/master
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the master deploy (see the Phase 5 manual setup)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/master/package-lock.json
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        run: npm test
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Health check
        if: steps.creds.outputs.ready == 'true' && vars.VITE_MASTER_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.VITE_MASTER_URL }}/v1/health"
