# `cargo test --target wasm32-wasip1` runs the test binaries under Node's WASI (Phase 24b), so the
# deterministic suites (worldgen goldens) are checked in WASM as well as natively.
[target.wasm32-wasip1]
runner = "tools/wasi-run.mjs"

# The browser client's WebTransport bindings are behind web-sys's unstable-API flag. WebAssembly
# SIMD (`+simd128`, owner 2026-11-06): the one module the page and every worker load (the client,
# the local world, the water, the server's jobs, the job pool) is built with it; without it
# rapier's 4-wide f64 math is emulated lane by lane. The shell checks the browser has SIMD before
# loading it (client/src/engine/simd.ts). wasm32-wasip1 (the tests under Node's WASI) stays scalar.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis", "-C", "target-feature=+simd128"]
